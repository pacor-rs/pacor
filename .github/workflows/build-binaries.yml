name: "Build Binaries"

# One place that knows how a pacor binary is built, packed and checksummed, so the
# release and the nightly build cannot drift apart: a platform added here appears in
# both, and a fix to the packaging lands in both.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, tag or branch to build (empty: the caller's ref)"
        required: false
        type: string
        default: ""
      retention_days:
        description: "How long the intermediate artifacts are kept"
        required: false
        type: number
        default: 3
      compress:
        description: "Compress the binaries with UPX (Linux and Windows only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build:
    name: "${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          # `upx: false` means "this platform cannot be compressed even when asked":
          # UPX produces a Mach-O binary that is not reliably runnable, so the macOS
          # entries opt out rather than depend on the caller remembering.
          - name: macOS-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary: pacor
            upx: false
          - name: macOS-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: pacor
            upx: false

          - name: Linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: pacor
            upx: true
          - name: Linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: pacor
            upx: true

          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: pacor.exe
            upx: true
          - name: Windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary: pacor.exe
            upx: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Read *and* write, unlike everything else here: this is the family nightly fills and
      # the release reuses. With `restore` alone the key was never saved by anyone, so every
      # one of these builds compiled from scratch — including the six nightly runs a week.
      - name: Cache release build
        uses: actions/cache@v5
        with:
          path: |
            target/${{ matrix.platform.target }}/release/.fingerprint
            target/${{ matrix.platform.target }}/release/deps
            target/${{ matrix.platform.target }}/release/build
          key: ${{ runner.os }}-rust-release-${{ matrix.platform.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-${{ matrix.platform.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      # The only target that needs a linker this runner does not ship.
      - name: Install the ARM64 linker
        if: matrix.platform.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --workspace --release --locked --target ${{ matrix.platform.target }}

      # Compression is off unless the caller asks for it: it saves roughly half the
      # download size, and it also rewrites the executable, which costs a clear
      # backtrace in crash reports and upsets some antivirus heuristics. A release that
      # needs smaller binaries turns it on; a nightly that is being debugged does not.
      - name: Install UPX (Linux)
        if: inputs.compress && matrix.platform.upx && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Install UPX (Windows)
        if: inputs.compress && matrix.platform.upx && runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/upx/upx/releases/download/v4.2.1/upx-4.2.1-win64.zip" -OutFile upx.zip
          Expand-Archive -Path upx.zip -DestinationPath .
          Move-Item upx-4.2.1-win64/upx.exe upx.exe

      # A compression failure is not worth failing a release over: the binary is
      # correct either way, it is just bigger.
      - name: Compress
        if: inputs.compress && matrix.platform.upx
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          BINARY: ${{ matrix.platform.binary }}
        run: |
          set -euo pipefail
          binary_path="target/${TARGET}/release/${BINARY}"
          echo "before: $(du -h "${binary_path}" | cut -f1)"

          compress() {
            if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
              ./upx.exe --best --lzma "${binary_path}"
            else
              upx --best --lzma "${binary_path}"
            fi
          }

          if ! compress; then
            echo "::warning::UPX could not compress ${BINARY}; publishing it uncompressed"
          fi

          echo "after: $(du -h "${binary_path}" | cut -f1)"

      # A cross-built binary cannot be executed here, so the smoke test only runs where
      # the target is the host — and a packaging bug that swapped the files would show
      # up as a `--version` that does not print the expected name.
      - name: Smoke test the binary
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          BINARY: ${{ matrix.platform.binary }}
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [[ "${TARGET}" != "${host}" ]]; then
            echo "cross-compiled (${TARGET} on ${host}); skipping the execution test"
            exit 0
          fi

          binary_path="target/${TARGET}/release/${BINARY}"
          test -f "${binary_path}" || { echo "::error::${binary_path} does not exist"; exit 1; }
          "${binary_path}" --version

      - name: Package and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
          BINARY: ${{ matrix.platform.binary }}
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          set -euo pipefail
          workspace="${PWD}"

          # A flat archive: whoever extracts it gets the binary, not the whole
          # `target/<triple>/release/` path it happened to be built in.
          if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
            asset="pacor-${PLATFORM}.zip"
            ( cd "target/${TARGET}/release" && 7z a -bso0 -bsp0 "${workspace}/${asset}" "${BINARY}" )
          else
            asset="pacor-${PLATFORM}.tar.gz"
            tar -czf "${asset}" -C "target/${TARGET}/release" "${BINARY}"
          fi

          # `sha256sum` format, so `sha256sum -c pacor-*.sha256` works for whoever
          # downloaded it, on any platform.
          sha256sum "${asset}" > "${asset}.sha256"
          cat "${asset}.sha256"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: |
            pacor-*.zip
            pacor-*.tar.gz
            pacor-*.sha256
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
