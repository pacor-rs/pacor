name: "Bump Version"

# The version lives in `[workspace.package]` and every crate inherits it, so a release
# is two edits (the version and the lock file) plus a tag. Doing that by hand is how a
# tag ends up disagreeing with `Cargo.toml` and the `verify` job in publish.yml rejects
# it five minutes later — this workflow exists to make the pair impossible to get wrong.
#
# The version is given, not derived: the repository has no `npm`/`cargo-release` to lean
# on, and guessing what "patch" means for a `0.1.0-alpha` is exactly the kind of thing
# that should be a decision rather than a rule.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version without the leading v (0.2.0, 0.2.0-alpha.1)"
        required: true
        type: string
      dry_run:
        description: "Show the change without committing, tagging or pushing"
        required: false
        default: false
        type: boolean

# Two dispatches at once would race on the same commit and tag.
concurrency:
  group: bump-version
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  bump:
    name: "Bump to ${{ inputs.version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # needed for `gh workflow run` at the end: the tag push above cannot start
      # publish.yml by itself
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          # `gh` reads neither `github.token` nor the secrets context on its own.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?(\+[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a semantic version (expected 0.2.0 or 0.2.0-alpha.1)"
            exit 1
          fi

          current=$(tr -d '\r' < Cargo.toml | sed -n '/^\[workspace\.package\]$/,/^\[/p' | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)
          if [[ -z "${current}" ]]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi
          if [[ "${VERSION}" == "${current}" ]]; then
            echo "::error::the workspace is already at ${current}"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists"
            exit 1
          fi

          echo "bumping ${current} → ${VERSION}"

          # Only the first `version` line after the `[workspace.package]` header: the
          # crates and the dependencies each carry their own `version` keys. The line
          # ending is carried over, so the rewrite preserves CRLF or LF as it finds it.
          awk -v new="${VERSION}" '
            {
              line = $0
              cr = ""
              if (line ~ /\r$/) { cr = "\r"; sub(/\r$/, "", line) }
              if (line == "[workspace.package]") { in_table = 1; print; next }
              if (line ~ /^\[/) { in_table = 0; print; next }
              if (in_table && !done && line ~ /^version = "/) {
                print "version = \"" new "\"" cr
                done = 1
                next
              }
              print
            }
          ' Cargo.toml > Cargo.toml.new
          mv Cargo.toml.new Cargo.toml

          # Bring the workspace entries in Cargo.lock along; without this the tag would
          # carry a lock file that `cargo build --locked` rejects.
          cargo update --workspace

          echo "--- changes ---"
          git --no-pager diff --stat
          git --no-pager diff Cargo.toml

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "dry run: nothing committed, tagged or pushed"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"

          # The commit first: publish.yml checks out the tag, and the tag must point at
          # a tree that is on the branch.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION}"

          # GitHub never starts a workflow from a push made with `GITHUB_TOKEN` (that is
          # what stops recursion), so the tag above does *not* start publish.yml by
          # itself. Dispatching it explicitly does, and keeps this workflow free of a
          # personal access token.
          gh workflow run publish.yml --ref "${GITHUB_REF_NAME}" -f "tag=v${VERSION}"
          echo "pushed v${VERSION} and started the release workflow"

      - name: Create a summary
        if: always()
        env:
          NEW_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          ACTOR: ${{ github.actor }}
        run: |
          {
            echo "## 📦 Version bump"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| New version | \`${NEW_VERSION}\` |"
            echo "| Dry run | \`${DRY_RUN}\` |"
            echo "| Triggered by | @${ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"
