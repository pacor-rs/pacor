name: "Cleanup Old Caches"

# Every cache key contains the toolchain and `Cargo.lock` hash, so each dependency bump
# creates a fresh set and leaves the previous one behind. GitHub keeps 10 GB per
# repository and evicts least-recently-used entries once that is exceeded — silently,
# and usually right before the pull request that needs a cache. This job keeps the
# newest entry of each family instead of letting the limit decide.
on:
  schedule:
    # Monday 00:00 UTC (08:00 Beijing time), an hour before the caches are warmed.
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be deleted"
        required: false
        default: false
        type: boolean

# Never cancel a cleanup halfway through: the remaining entries would be left behind
# until the next run, which is exactly the state it exists to prevent.
concurrency:
  group: cleanup-old-caches
  cancel-in-progress: false

jobs:
  cleanup-caches:
    name: "Keep the newest cache of each family"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write # required to delete caches
    steps:
      - name: Delete the superseded caches
        uses: actions/github-script@v7
        with:
          script: |
            const DRY_RUN = '${{ github.event.inputs.dry_run }}' === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // ── 1. Every cache entry, newest first ───────────────────────────────
            let allCaches = [];
            let page = 1;
            while (true) {
              const { data } = await github.rest.actions.getActionsCacheList({
                owner, repo,
                per_page: 100,
                page,
                sort: 'created_at',
                direction: 'desc',
              });
              if (!data.actions_caches.length) break;
              allCaches = allCaches.concat(data.actions_caches);
              if (data.actions_caches.length < 100) break;
              page++;
            }

            console.log(`📦 Found ${allCaches.length} cache entries`);

            // ── 2. Group by family ───────────────────────────────────────────────
            // A family is everything before the last '-' of the key, which is exactly
            // the prefix restored by `restore-keys`:
            //   Linux-cargo-registry-<toolchain>-<lock hash> → Linux-cargo-registry-<toolchain>
            //   Linux-rust-cross-<target>-<toolchain>-<lock hash> → …-<target>-<toolchain>
            // Entries of the same family are interchangeable; only the newest is worth
            // keeping, because the older lock hash will never be asked for again.
            const getFamily = (key) => {
              const index = key.lastIndexOf('-');
              return index > 0 ? key.substring(0, index) : key;
            };

            const families = {};
            for (const cache of allCaches) {
              const family = getFamily(cache.key);
              if (!families[family]) families[family] = [];
              families[family].push(cache);
            }

            // ── 3. Keep the newest of each family ────────────────────────────────
            const toDelete = [];
            for (const [family, caches] of Object.entries(families)) {
              const [keep, ...rest] = caches; // already newest-first
              if (rest.length === 0) continue;

              console.log(`\n🔑 ${family} — keep [${keep.key}], delete ${rest.length}`);
              for (const cache of rest) {
                console.log(`   ❌ ${cache.key} (id=${cache.id}, ${cache.created_at})`);
                toDelete.push(cache);
              }
            }

            if (toDelete.length === 0) {
              console.log('\n✅ No superseded caches, nothing to do');
              return;
            }

            console.log(`\n🗑️  ${toDelete.length} cache(s) to delete`);
            if (DRY_RUN) {
              console.log('🔍 dry run: nothing was deleted');
              return;
            }

            // ── 4. Delete ───────────────────────────────────────────────────────
            let deleted = 0;
            let failed = 0;
            for (const cache of toDelete) {
              try {
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo,
                  cache_id: cache.id,
                });
                deleted++;
              } catch (error) {
                // A cache can disappear between listing and deleting it; that is not a
                // reason to fail the run.
                console.error(`   ⚠️  ${cache.key}: ${error.message}`);
                failed++;
              }
            }

            console.log(`\n🎉 ${deleted} deleted, ${failed} failed`);
