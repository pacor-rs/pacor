name: "Delete Merged Branch"

# A merged pull request leaves its branch behind: the work is on `main`, and the ref only
# makes `git branch -r` noisy and hides the branches that are still open.
#
# Two ways in, one implementation. `pull_request.closed` covers a merge made by a person.
# `workflow_call` covers the `automerge` job in `pr-check.yml`: that job merges with the
# repository `GITHUB_TOKEN`, and GitHub does not start a workflow for the events that token
# causes - which is why #17 and #18 were merged with no cleanup run at all. Calling the
# cleanup from the merge job fixes that at its source; polling for leftovers would only hide
# the fact that the event never arrives.
#
# `workflow_dispatch` takes a pull request number for the one-off case: a branch left by a
# merge that happened before this workflow could be called, or a run that failed.
on:
  pull_request:
    types:
      - closed
  workflow_call:
    inputs:
      pull_request_number:
        description: "The merged pull request whose head branch should be deleted"
        required: true
        type: number
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "The merged pull request whose head branch should be deleted"
        required: true
        type: number

# Two runs must not race on the same ref: a reopened pull request, a stacked pair, or a
# manual dispatch overtaking the merge job. Never cancel: a delete is a single API call, and
# cutting it in half tells nobody whether it happened.
concurrency:
  group: delete-merged-branch-${{ inputs.pull_request_number || github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # `gh` needs to know which repository to talk to; there is no checkout in this job.
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  delete-branch:
    name: "Delete the merged branch"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      # One resolution step for all three triggers. The event payload cannot be trusted for
      # the called case: the merge happens during the caller's run, so the payload still
      # describes an open pull request. Asking the API makes the three paths identical.
      - name: Resolve the pull request
        id: pr
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          INPUT_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail

          number="${INPUT_NUMBER:-${NUMBER}}"
          if [[ -z "${number}" ]]; then
            echo "::error::No pull request number; pass one as pull_request_number"
            exit 1
          fi

          merged=$(gh pr view "${number}" --json mergedAt --jq '.mergedAt != null')
          if [[ "${merged}" != "true" ]]; then
            echo "::notice::#${number} is not merged; there is no branch to delete"
            echo "delete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ $(gh pr view "${number}" --json isCrossRepository --jq '.isCrossRepository') == "true" ]]; then
            echo "::notice::#${number} came from a fork; its branch is in another repository"
            echo "delete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch=$(gh pr view "${number}" --json headRefName --jq '.headRefName')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "delete=true" >> "$GITHUB_OUTPUT"

      # A branch can be merged and still be the base of the next pull request, or be one of
      # the names this repository keeps on purpose. Neither is a leftover.
      - name: Decide whether the branch is a leftover
        id: guard
        if: steps.pr.outputs.delete == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail

          long_lived=(main master develop dev backup)
          for kept in "${long_lived[@]}"; do
            if [[ "${BRANCH}" == "${kept}" ]]; then
              echo "::notice::${BRANCH} is a long-lived branch; keeping it"
              echo "delete=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          case "${BRANCH}" in
            release/*|release-*)
              echo "::notice::${BRANCH} looks like a release branch; keeping it"
              echo "delete=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          echo "delete=true" >> "$GITHUB_OUTPUT"

      # Deleting the head of a still-open pull request would close it without a decision,
      # which is exactly what a stacked pair of pull requests looks like.
      - name: Check that no open pull request still uses it
        id: busy
        if: steps.guard.outputs.delete == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail

          open=$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')
          if [[ "${open}" != "0" ]]; then
            echo "::notice::${open} open pull request(s) still use ${BRANCH}; keeping it"
            echo "delete=false" >> "$GITHUB_OUTPUT"
          else
            echo "delete=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete the branch
        id: deletion
        if: steps.guard.outputs.delete == 'true' && steps.busy.outputs.delete == 'true'
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail

          # The repository can be set to delete head branches itself; then finding the ref
          # gone is the outcome this job wanted, not a failure.
          if ! gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null \
            2>"${RUNNER_TEMP}/delete.err"; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
              cat "${RUNNER_TEMP}/delete.err" >&2
              exit 1
            fi
            echo "::notice::${BRANCH} was already deleted"
            echo "deleted=already" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deleted ${BRANCH}"
          echo "deleted=yes" >> "$GITHUB_OUTPUT"

      - name: Record what happened
        if: always()
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          GUARD: ${{ steps.guard.outputs.delete }}
          BUSY: ${{ steps.busy.outputs.delete }}
          DELETION: ${{ steps.deletion.outputs.deleted }}
        run: |
          {
            echo "## 🧹 Merged branch cleanup"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Pull request | #${NUMBER:-?} |"
            echo "| Branch | \`${BRANCH:-none}\` |"
            echo "| Outcome | $(
              if [[ "${GUARD}" == "false" || "${BUSY}" == "false" ]]; then
                echo "kept"
              elif [[ "${DELETION}" == "already" ]]; then
                echo "already gone"
              elif [[ "${DELETION}" == "yes" ]]; then
                echo "deleted"
              else
                echo "nothing to do"
              fi
            ) |"
            echo ""
            echo "Every kept branch has its reason in the step log; the commits are on \`main\` either way."
          } >> "$GITHUB_STEP_SUMMARY"
