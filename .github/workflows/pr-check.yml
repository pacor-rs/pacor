name: "PR Check"

# A newer push to the same pull request supersedes the previous run: the older one
# would otherwise keep a cache and a runner busy for a result nobody reads any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    # Every pull request, whatever branch it targets. Restricting this to `main` meant a
    # stacked pull request — one based on another branch, which is how a multi-commit change
    # gets reviewed — started no checks at all, so its first review was the one it got after
    # its base merged and GitHub retargeted it at `main`.
    paths:
      # Everything that can change what CI has to say about a change belongs here. A
      # pull request that only edits the workflows or the documentation used to start
      # no workflow at all, so the first run it ever got was the release.
      - ".github/**"
      - ".cargo/**"
      - "crates/**"
      - "docs/**"
      - "*.md"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental data is not part of the cached paths, so leaving it on only makes the
  # restored build directory bigger (and prints a "could not be used" warning).
  CARGO_INCREMENTAL: 0

# Least privilege by default. A job-level block replaces this one rather than adding to
# it, so a job that needs to write spells out every scope it uses.
permissions:
  contents: read

jobs:
  # Decide which of the checks below are worth running.
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
      workflow: ${{ steps.changes.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
            workflow:
              - '.github/**'

  # Every packaging backend compiles on every host, so this matrix type-checks the
  # macOS and Windows backends even from Linux. The macOS and Windows entries are also
  # where their platform-specific code is actually compiled and run.
  core-check:
    name: "Rust Code Check (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The host triple is written out even though it *is* the host: the cache path
        # has to be the same shape as the cross ones, otherwise `warm-cache.yml` could
        # not pre-build it — `target/debug` is only reachable by the job that runs
        # here, and a cache written by a pull request belongs to that pull request.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The triple is checked rather than assumed: `macos-latest` moving to another
      # architecture would silently key every cache under a name nothing reads, and the job
      # would keep passing.
      - name: Assert the target is this runner's host
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${host}" != "${{ matrix.target }}" ]]; then
            echo "::error::${{ matrix.target }} is not this runner's host (${host}): update the matrix here and in pr-check.yml"
            exit 1
          fi

      - name: Cache cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache debug build
        uses: actions/cache/restore@v5
        with:
          # Kept outside `path` below: a `#` line inside the block is a literal path, and
          # it takes part in the cache version hash — a comment there makes the entry
          # unmatchable from a workflow that writes the paths without it.
          # Cargo stores build-script and proc-macro artifacts, which are built for the
          # host rather than the target, in the untripled directories — even when
          # `--target` names the host. Without these three lines every job rebuilds
          # roughly thirty of them from scratch, cache hit or not.
          path: |
            target/${{ matrix.target }}/debug/.fingerprint
            target/${{ matrix.target }}/debug/deps
            target/${{ matrix.target }}/debug/build
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          # The toolchain stays in the fallback prefix: artifacts built by another rustc
          # are unusable (cargo's fingerprints include it), so restoring them only costs
          # a large download. A toolchain update means one honest cold build instead.
          restore-keys: |
            ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cache release build
        uses: actions/cache/restore@v5
        with:
          path: |
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/build
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      # `--all-targets` so test code is linted too, not only the libraries and binaries.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings

      - name: Cargo test
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Cargo build (release)
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

  # The release profile compiles different code: `panic = "abort"`, LTO and — the part
  # that actually hides mistakes — `#[cfg(debug_assertions)]`, which gates the `trace`
  # log level in `pacor-cli`. A dead-code or unused-import warning created by that gate
  # never shows up in the debug pass above. Ubuntu only: the difference is not
  # platform-specific, and this is the most expensive job in the file.
  release-lints:
    name: "Rust Lints (release profile)"
    runs-on: ubuntu-latest
    env:
      # Named once: it is in the cache key, so a wrong value means warming one entry
      # and reading another.
      TARGET: x86_64-unknown-linux-gnu
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache release build
        uses: actions/cache/restore@v5
        with:
          path: |
            target/${{ env.TARGET }}/release/.fingerprint
            target/${{ env.TARGET }}/release/deps
            target/${{ env.TARGET }}/release/build
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-v4-${{ env.TARGET }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-v4-${{ env.TARGET }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cargo clippy (release)
        run: cargo clippy --workspace --all-targets --release --locked --target "${TARGET}" -- -D warnings

  # No C dependencies (compression uses the pure-Rust `zlib-rs` backend), so the other
  # targets can be checked without any cross toolchain — far earlier than the release
  # matrix would notice a `cfg(windows)`-only mistake.
  cross-check:
    name: "Cross-check ${{ matrix.target }}"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true' || needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          # The release builds this one, so check it too: it is the target whose
          # dependencies made an older pipeline need an OpenSSL sysroot at release time.
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Read-only: `warm-cache.yml` writes this family from `main`. Writing it here would be
      # pointless — a cache saved by a pull request is scoped to that pull request's merge
      # ref, so the next pull request still compiles from scratch.
      - name: Cache target build
        uses: actions/cache/restore@v5
        with:
          path: |
            target/${{ matrix.target }}/debug/.fingerprint
            target/${{ matrix.target }}/debug/deps
            target/${{ matrix.target }}/debug/build
            # Cargo stores build-script and proc-macro artifacts, which are built for the
            # host rather than the target, in the untripled directories — even when
            # `--target` names the host. Without these three lines every job rebuilds
            # roughly thirty of them from scratch, cache hit or not.
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      # `ring`, the crypto backend of rustls, compiles a little C: this is the only cross
      # target here that does not already have a compiler for it on PATH.
      - name: Install the ARM64 C compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # `RUSTFLAGS` rather than `-- -D warnings`: `cargo check` takes no rustc arguments.
      - name: Cargo check for target
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}

  # A typo in a workflow is otherwise only noticed when it fails to run — a gate that
  # never fires because its `if:` names the wrong job looks exactly like a passing one.
  workflow-lint:
    name: "Workflow Lint"
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.workflow == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The release binary rather than the `rhysd/actionlint` image: no registry
      # round-trip, and the download is checked against the checksums file published
      # next to it, which an image tag cannot express.
      - name: Install actionlint
        env:
          VERSION: "1.7.7"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -sSfL -O "${base}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSfL -O "${base}/actionlint_${VERSION}_checksums.txt"
          grep " actionlint_${VERSION}_linux_amd64.tar.gz$" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint --version

      # Only warnings and errors are gated: `-S info` also flags deliberate style
      # choices, and the release workflows rely on a few of those on purpose. The
      # shellcheck pass uses the runner's own binary (present on `ubuntu-latest`) and
      # degrades to actionlint alone rather than failing when it is not.
      - name: Lint the workflows
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            ./actionlint -color -shellcheck 'shellcheck -S warning'
          else
            echo "shellcheck is not installed; linting without the shell pass"
            ./actionlint -color
          fi

  # Merging by hand is the only step left after CI is green on a one-line fix, so a
  # pull request labelled `automerge` is merged as soon as no executed check failed.
  # A skipped check (nothing relevant changed) is fine; a failed or cancelled one is
  # not, which is why the `needs` results are spelled out instead of `success()`.
  #
  # The merge runs on `AUTOMERGE_TOKEN`, not `GITHUB_TOKEN`, and that is the whole point:
  # GitHub does not start a workflow for the events `GITHUB_TOKEN` causes, so a merge made
  # with it leaves the `pull_request.closed` listener in `delete-merged-branch.yml` with
  # nothing to hear. #17 and #18 were merged that way and their branches stayed behind. A
  # token that belongs to a person or an app produces a real event, and the cleanup runs.
  auto-merge:
    name: "Auto Merge"
    runs-on: ubuntu-latest
    needs: [detect-changes, core-check, release-lints, cross-check, workflow-lint]
    # Same-repository branches only: a pull request from a fork gets a read-only token,
    # so it could not merge even if it should.
    if: >-
      always() && !cancelled()
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.detect-changes.result == 'success'
      && (needs.core-check.result == 'success' || needs.core-check.result == 'skipped')
      && (needs.release-lints.result == 'success' || needs.release-lints.result == 'skipped')
      && (needs.cross-check.result == 'success' || needs.cross-check.result == 'skipped')
      && (needs.workflow-lint.result == 'success' || needs.workflow-lint.result == 'skipped')
    timeout-minutes: 10
    # `gh` reads the label with the repository's own token; the merge itself uses
    # `AUTOMERGE_TOKEN`, which is why no write scope is requested here.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The action below fails with "environment variable GITHUB_TOKEN not set!" when the
      # secret is empty, which says nothing about what to do. The label is read through the
      # API rather than from the payload, because a label added after the run started is not
      # in the payload while the action itself reads it live.
      - name: Check that the merge token is configured
        env:
          TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          # There is no checkout in this job, so `gh` cannot infer the repository from a
          # remote; without this it fails before it reads a single label.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "${TOKEN:-}" ]]; then
            exit 0
          fi

          labels=$(gh pr view "${NUMBER}" --json labels --jq '.labels[].name') || {
            echo "::error::Could not read the labels of #${NUMBER}."
            exit 1
          }

          if ! grep -qx automerge <<< "${labels}"; then
            echo "::notice::#${NUMBER} has no automerge label, so the missing AUTOMERGE_TOKEN is not used here."
            exit 0
          fi

          echo "::error::AUTOMERGE_TOKEN is not set, so this labelled pull request cannot be merged."
          echo "::error::Create a fine-grained personal access token for this repository with"
          echo "::error::Contents, Pull requests and Workflows set to read and write, then store it:"
          echo "::error::  gh secret set AUTOMERGE_TOKEN --body <token>"
          exit 1

      - name: Auto merge PR
        uses: pascalgn/automerge-action@v0.16.4
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          MERGE_LABELS: "automerge"
          MERGE_REMOVE_LABELS: "automerge"
