name: "PR Check"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pr-check.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      core: ${{ steps.changes.outputs.core }}
      workflow: ${{ steps.changes.outputs.workflow }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            core:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            workflow:
              - '.github/workflows/**'

  core-check:
    name: "Rust Code Check (${{ matrix.os }})"
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-workspace-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-workspace-rust-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      # Every packaging backend compiles on every host, so this single job
      # type-checks the macOS and Windows backends even on Linux.
      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

      - name: Cargo build
        run: cargo build --workspace --release

  cross-check:
    name: "Cross-check other targets"
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/${{ matrix.target }}/debug/deps
            target/${{ matrix.target }}/debug/build
          key: ${{ runner.os }}-${{ matrix.target }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-rust-

      # No C dependencies, so this needs no cross toolchain; it catches
      # platform-specific regressions far earlier than the release matrix.
      # (RUSTFLAGS rather than `-- -D warnings`: cargo check takes no rustc args.)
      - name: Cargo check for target
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --target ${{ matrix.target }}
