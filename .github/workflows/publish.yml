name: "Publish Release"

# Release from a tag, not from a branch: the tag is what the version in `Cargo.toml`
# names, and the `verify` job below refuses to build one that disagrees. Dispatching
# this workflow by hand re-publishes an existing tag (a broken asset, a failed upload)
# without inventing a new version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true
        type: string
      compress:
        description: "Compress the release binaries with UPX (Linux and Windows)"
        required: false
        default: false
        type: boolean

# A release must never be cancelled halfway through an upload: re-running it for the
# same tag is the way out of a bad state, and that run has to queue behind this one.
concurrency:
  group: publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Least privilege by default; the `release` job asks for the write scope it needs.
permissions:
  contents: read

jobs:
  # Fails in a minute instead of after six runners have built binaries for a tag that
  # does not match the workspace version.
  verify:
    name: "Verify the tag matches the workspace version"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the version
        id: version
        run: |
          set -euo pipefail

          # `version` lives in `[workspace.package]`; every crate inherits it. The
          # stream is normalised first: a CRLF checkout would otherwise stop the sed
          # range from matching at all, and the error would look like a missing key.
          version=$(tr -d '\r' < Cargo.toml | sed -n '/^\[workspace\.package\]$/,/^\[/p' | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n1)
          if [[ -z "${version}" ]]; then
            echo "::error::could not read [workspace.package] version from Cargo.toml"
            exit 1
          fi

          if [[ "v${version}" != "${TAG}" ]]; then
            echo "::error::tag ${TAG} does not match the workspace version v${version}; bump the version first (see .github/workflows/bump.yml)"
            exit 1
          fi

          # A build that finds the lock file stale fails on its own (`--locked` below and
          # in build-binaries.yml), so nothing else has to be resolved here.

          # `0.1.0-alpha` and friends are published as pre-releases, which also keeps
          # them off the "latest release" slot that the updater and the badge read.
          if [[ "${version}" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "publishing ${TAG} (pre-release: ${prerelease})"

  # The same six-platform build the nightly uses.
  build:
    name: "Build"
    needs: verify
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.verify.outputs.tag }}
      # Off by default. `github.event.inputs` rather than `inputs`: it exists for every
      # trigger, and a tag push simply has no such input, which compares as false.
      compress: ${{ github.event.inputs.compress == 'true' }}

  release:
    name: "Publish ${{ needs.verify.outputs.tag }}"
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}
          fetch-depth: 0

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Determine the changelog range
        id: range
        run: |
          set -euo pipefail
          # The previous *stable* tag: a nightly tag is a moving target and would make
          # the range cover the same commits twice.
          previous=$(git describe --tags --abbrev=0 --exclude=nightly "${TAG}^" 2>/dev/null || true)
          if [[ -z "${previous}" ]]; then
            previous=$(git rev-list --max-parents=0 HEAD)
            echo "no earlier tag; the changelog starts at the root commit ${previous}"
          fi
          echo "from=${previous}" >> "$GITHUB_OUTPUT"

      - name: Build the changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-configuration.json"
          fromTag: ${{ steps.range.outputs.from }}
          toTag: ${{ needs.verify.outputs.tag }}
          # A repository without pull-request labels still has commits to list, and the
          # fallback below is what turns them into notes.
          failOnError: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the release notes
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          FROM: ${{ steps.range.outputs.from }}
        run: |
          set -euo pipefail

          # The action needs pull-request labels to group anything; a repository that
          # merges without them gets the commit list instead of an empty section.
          if [[ -n "${CHANGELOG}" && "${CHANGELOG}" != "No changes" ]]; then
            printf '%s\n' "${CHANGELOG}" > notes.md
          else
            printf '## Changes\n\n' > notes.md
            git log --pretty='- %s' "${FROM}..${TAG}" >> notes.md
          fi

          {
            printf '\n### Downloads\n\n'
            for asset in dist/pacor-*; do
              [[ -f "${asset}" ]] || continue
              case "${asset}" in
                *.sha256) continue ;;
              esac
              printf -- '- `%s`\n' "$(basename "${asset}")"
            done
            printf '\nEach archive has a `.sha256` next to it, and `SHA256SUMS` lists every\n'
            printf 'asset in a form `sha256sum -c SHA256SUMS` accepts.\n'
          } >> notes.md

          # One combined checksum file is easier to fetch than six separate ones, and it
          # is what a package manifest (winget, Scoop, Homebrew) wants anyway.
          cat dist/*.sha256 > SHA256SUMS
          echo "--- notes.md ---"
          cat notes.md

      # Draft first: a build that fails to upload must not leave a half-populated release
      # that the "latest" badge and the updater would happily point at.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail

          if [[ "${PRERELEASE}" == "true" ]]; then
            channel_args=(--prerelease --latest=false)
          else
            channel_args=(--latest)
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "release ${TAG} exists; replacing its notes and assets"
            gh release edit "${TAG}" --title "${TAG}" --notes-file notes.md "${channel_args[@]}"
          else
            gh release create "${TAG}" --draft --title "${TAG}" --notes-file notes.md "${channel_args[@]}"
          fi

          gh release upload "${TAG}" dist/pacor-* SHA256SUMS --clobber
          gh release edit "${TAG}" --draft=false

      - name: Create a release summary
        if: always()
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## 🚀 ${TAG}"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`${RELEASE_VERSION}\` |"
            echo "| Pre-release | \`${PRERELEASE}\` |"
            echo "| Triggered by | @${ACTOR} |"
            echo ""
            echo "[View the release](https://github.com/${REPOSITORY}/releases/tag/${TAG})"
          } >> "$GITHUB_STEP_SUMMARY"
