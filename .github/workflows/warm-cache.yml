name: "Cache Warming"

# The caches are keyed by the resolved toolchain plus `Cargo.lock`, so a dependency
# bump or a toolchain update invalidates all of them at once — and every pull request
# that arrives next then compiles the whole workspace from scratch. Building the caches
# here, ahead of time, keeps the first pull request after such a change as fast as the
# tenth.
#
# This workflow is the only writer for the pull-request jobs, and that is a correctness
# requirement rather than tidiness: a cache written by a pull request is scoped to that
# pull request's merge ref, so no other pull request can restore it — the job next door
# reports `Cache not found` for a key that was saved minutes earlier, by a run that had the
# same `Cargo.lock` and the same toolchain. Only a run on `main` produces entries that every
# pull request can read.
#
# Every entry is keyed by target, host ones included, because every job in pr-check.yml
# passes `--target` explicitly. `target/<triple>/…` is a path this workflow can fill in for
# another platform's job; a plain `target/debug` could only ever be written by the very job
# that would have read it, which is what made the old host-only keys unshareable.
on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**/Cargo.toml"
      - ".github/workflows/warm-cache.yml"
  workflow_dispatch:
  schedule:
    # Monday 05:00 UTC (13:00 Beijing time). A `stable` release changes the toolchain
    # without touching any file the filters above watch, so without a periodic run the
    # newest caches would belong to the previous compiler.
    - cron: "0 5 * * 1"

# Two warmings at once would race to save the same cache keys; the newer one wins, so
# the stale run is not worth finishing.
concurrency:
  group: warm-cache
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  warm:
    name: "Warm caches (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The host triple is written out even though it *is* the host: pr-check.yml passes
        # `--target` for the host jobs too, and a cache whose path has no triple in it is
        # one this job could never fill for somebody else.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # If `macos-latest` or `windows-latest` ever moves to another architecture, the matrix
      # above starts warming keys nobody reads — and everything keeps looking green. Fail
      # here instead.
      - name: Assert the target is this runner's host
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "${host}" != "${{ matrix.target }}" ]]; then
            echo "::error::${{ matrix.target }} is not this runner's host (${host}): update the matrix here and in pr-check.yml"
            exit 1
          fi

      # `actions/cache` rather than `actions/cache/restore`: this job exists to *write* the
      # entries the pull-request jobs only read. The keys are byte-for-byte the ones
      # pr-check.yml uses, otherwise warming would create a parallel set nothing reads.
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache debug build
        uses: actions/cache@v5
        with:
          # Kept outside `path` below: a `#` line inside the block is a literal path, and
          # it takes part in the cache version hash — a comment there makes the entry
          # unmatchable from a workflow that writes the paths without it.
          # Cargo stores build-script and proc-macro artifacts, which are built for the
          # host rather than the target, in the untripled directories — even when
          # `--target` names the host. Without these three lines every job rebuilds
          # roughly thirty of them from scratch, cache hit or not.
          path: |
            target/${{ matrix.target }}/debug/.fingerprint
            target/${{ matrix.target }}/debug/deps
            target/${{ matrix.target }}/debug/build
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cache release build
        uses: actions/cache@v5
        with:
          path: |
            target/${{ matrix.target }}/release/.fingerprint
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/build
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Fetch dependencies
        run: cargo fetch --locked

      # Exactly the commands the pull-request jobs run. Clippy writes its own (per-lint)
      # fingerprints, so a plain `cargo build` would not warm them; `--target` is part of
      # the fingerprint as well, so a command that differs by a flag warms nothing either.
      - name: Build and lint
        run: |
          cargo build --workspace --tests --locked --target ${{ matrix.target }}
          cargo clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
          cargo build --workspace --release --locked --target ${{ matrix.target }}

      # The release lint pass only runs on Linux in CI, so only Linux pays for it here.
      - name: Lint the release profile
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --release --locked --target ${{ matrix.target }} -- -D warnings

  # `cross-check` reads these, and it is the job that would otherwise compile four targets
  # from scratch on every pull request — its own writes are invisible to the next pull
  # request, so without this the only way to warm them would be to make the same mistake
  # again. The release equivalents are not warmed here: `nightly` builds all six targets
  # every day and its caches live on `main` too.
  warm-cross:
    name: "Warm caches (${{ matrix.target }})"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Read-only here on purpose: the registry is target-independent and the three `warm`
      # jobs above already save it. Four matrix entries writing one key would only race.
      - name: Cache cargo registry
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target build
        uses: actions/cache@v5
        with:
          path: |
            target/${{ matrix.target }}/debug/.fingerprint
            target/${{ matrix.target }}/debug/deps
            target/${{ matrix.target }}/debug/build
            # Cargo stores build-script and proc-macro artifacts, which are built for the
            # host rather than the target, in the untripled directories — even when
            # `--target` names the host. Without these three lines every job rebuilds
            # roughly thirty of them from scratch, cache hit or not.
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-debug-v4-${{ matrix.target }}-${{ steps.rust-toolchain.outputs.cachekey }}-

      # `ring`, the crypto backend of rustls, compiles a little C: this is the only cross
      # target here that does not already have a compiler for it on PATH.
      - name: Install the ARM64 C compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      # Byte for byte the command `cross-check` runs, `RUSTFLAGS` included: it is part of
      # cargo's fingerprint, and `cargo check` takes no rustc arguments.
      - name: Cargo check for target
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo check --workspace --all-targets --locked --target ${{ matrix.target }}
