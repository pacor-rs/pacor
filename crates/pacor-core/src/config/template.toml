# pacor.toml — single configuration file for every supported platform.
#
# One file describes all platforms; `pacor build --target <linux|macos|windows|android>`
# selects which section is consumed. Sections for other platforms are ignored,
# so the same file can be committed and used on any host.
#
# Run `pacor config --full` to print the effective, merged configuration.

[app]
# Fallback locale. Must have a matching `[app.i18n.<locale>]` entry.
default_locale = "en-US"
url = "https://example.com"
authors = ["Your Name <you@example.com>"]

# Localized application metadata. Add one table per supported locale.
#
# These drive, per target:
#   Linux   -> desktop entry `Name[locale]` / `Comment[locale]`, using the
#              POSIX spelling required by the desktop entry spec (zh_CN, not zh-CN)
#   macOS   -> `<language-id>.lproj/InfoPlist.strings` plus `CFBundleLocalizations`
#              using Apple language IDs (zh-Hans, zh-Hant, en, en-GB, ja)
#   Windows -> NSIS language macros and `LangString` blocks
# Android uses no localized metadata (the APK has no installer UI).
[app.i18n.en-US]
name = "My App"
display_name = "My App"
description = "A Flutter application"
publisher = "Publisher Name"
copyright = "Copyright (C) 2025 Publisher Name. All rights reserved."

[app.i18n.zh-CN]
name = "我的应用"
display_name = "我的应用"
description = "一个 Flutter 应用"
publisher = "我的公司"
copyright = "版权所有 © 2025 我的公司。保留所有权利。"

[build]
# release | debug | profile. Drives `flutter build --<mode>` and the directory
# the bundle is read from, e.g. build/windows/x64/runner/Release.
flutter_build_mode = "release"
output_dir = "dist"

# ---------------------------------------------------------------------------
# Linux: AppImage and/or DEB
# ---------------------------------------------------------------------------
[platforms.linux]
enabled = true
# formats = ["appimage", "deb", "rpm"]   # rpm is not implemented yet
formats = ["appimage"]
# maintainer = "Your Name <you@example.com>"
# icon_directory = "assets/icons"        # defaults to a downloaded icon set

# Freedesktop desktop entry. `Categories` decides which application menu the
# entry appears in. It defaults to ["Utility"] (the "Accessories" menu).
#
# Values use the canonical spellings from the freedesktop registries:
#   Main       -> AudioVideo, Audio, Video, Development, Education, Game,
#                 Graphics, Network, Office, Science, Settings, System, Utility
#   Additional -> 2DGraphics, FileTools, Player, TextEditor, IDE, GTK, ...
#
# Two rules are checked when the configuration is loaded:
#   * `Additional` categories require at least one `Main` category, otherwise
#     the entry cannot be placed in any menu (this is an error).
#   * every `Additional` category should come with one of its related
#     categories, e.g. `FileTools` with `Utility`, `TextEditor` with `Utility`.
#     Violations are reported as warnings.
[platforms.linux.desktop]
categories = [{ Main = "Utility" }]
# Example of a paired main + additional configuration:
# categories = [{ Main = "Graphics" }, { Additional = "2DGraphics" }]
# comment = "Short description shown by application menus"
# mime_type = "x-scheme-handler/myapp"

[platforms.linux.deb]
# section = "utils"
# priority = "optional"
# depends = ["libgtk-3-0", "libblkid1", "liblzma5"]
# changelog = "CHANGELOG.md"

# ---------------------------------------------------------------------------
# Windows: NSIS or MSI installer, and/or portable ZIP
# ---------------------------------------------------------------------------
[platforms.windows]
enabled = true
# `nsis` installs per user (no administrator rights needed), `msi` installs per
# machine below Program Files (and therefore needs them). See docs/MSI.md.
installer_format = "nsis"      # nsis | msi
build_portable = true
# Portable archives contain a single top-level directory named
# `<name>-<version>-<arch>`, so extracting one cannot scatter the application.
# signing_tool_path = "C:/Program Files (x86)/Windows Kits/10/bin/signtool.exe"
# certificate_path = "cert.pfx"
# Prefer the PACOR_WINDOWS_CERT_PASSWORD environment variable over a literal.
# certificate_password = "..."
# RFC 3161 timestamp server. Without one, signatures stop being valid when the
# certificate expires; set it to "" to sign without a timestamp.
# timestamp_url = "http://timestamp.digicert.com"
# MSI only. `upgrade_code` decides which earlier products a package replaces and
# is derived from the application name and publisher when left out, so it stays
# the same across releases; pin it if the app is renamed or republished.
# msi_upgrade_code = "{11223344-5566-7788-99AA-BBCCDDEEFF00}"
# MSI only. Windows Installer stores every string in one code page per package;
# the default is the locale's (936 for zh-CN, for example). Override it when a
# localized string uses a character that code page cannot encode — a `©` in a
# zh-CN package fails to build with LGHT0311. Rewording is usually better.
# msi_codepage = 65001

# ---------------------------------------------------------------------------
# macOS: DMG installer (+ tar.gz updater archive)
# ---------------------------------------------------------------------------
[platforms.macos]
enabled = true
minimum_system_version = "10.14"
category = "public.app-category.entertainment"
# dmg_background = "assets/dmg-background.png"
# dmg_window_size = [500, 350]
# codesign_identity = "Developer ID Application: ..."
# notarize_credentials = "AC_PASSWORD"   # notarytool keychain profile

# ---------------------------------------------------------------------------
# Android: per-ABI APK and/or an Android App Bundle
# ---------------------------------------------------------------------------
[platforms.android]
enabled = true
# ABIs to build: "armeabi-v7a", "arm64-v8a", "x86_64". At least one.
# An APK is produced per ABI; a bundle is one file containing these ABIs, so
# keeping only arm64-v8a here also limits the bundle to 64-bit ARM devices.
target_abi = ["arm64-v8a"]
# Output formats: "apk" (installed directly), "aab" (uploaded to Google Play).
# `aab` is opt-in: it cannot be installed on a device, and projects that only
# distribute APKs should not pay for building one.
formats = ["apk"]
# formats = ["apk", "aab"]
# Gradle product flavor, passed through to `flutter build … --flavor`.
# flavor = "prod"
# Signing. Setting `keystore_file` enables it for every configured format, and
# then the alias plus both passwords are required — pacor fails instead of
# shipping an unsigned artifact.
# keystore_file = "android/app/upload-keystore.jks"   # relative to the project root
# key_alias = "upload"
# Prefer the PACOR_ANDROID_KEYSTORE_PASSWORD / PACOR_ANDROID_KEY_PASSWORD
# environment variables over the literals below; the literals end up in the
# signing command line.
# keystore_password = "..."
# key_password = "..."
# APKs are signed with `apksigner` (Android SDK build-tools), App Bundles with
# `jarsigner` (a JDK). Both are looked up on PATH and in their usual homes; set
# these to point at specific ones. A tool path alone does not enable signing.
# signing_tool_path = "C:/Android/sdk/build-tools/35.0.0/apksigner.bat"
# jarsigner_path = "C:/Program Files/Android/Android Studio/jbr/bin/jarsigner.exe"
#
# Android always builds release and does not use `[app.i18n]`; see docs/ANDROID.md.
